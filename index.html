<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="fCUKdl8bNoQ462COEZQlg9gx9g2S11lOO2Gmqyds32g" />
<title>全国再開発DB｜東京・首都圏の再開発計画検索</title>

<style>
body{
    font-family:sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f5f7fa;
}

h1{
    color:#0066cc;
}

#search{
    width:100%;
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.station{
    color:#666;
}

.year{
    color:#0066cc;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🏗 全国再開発DB</h1>
<p>
東京・神奈川・埼玉・千葉を中心とした
再開発計画データベースです。
駅名や案件名で検索できます。
</p>
<input
id="search"
type="text"
placeholder="駅名・案件名で検索">

<div id="results"></div>

<script>

let projects = [

{
name:"渋谷駅桜丘地区再開発",
station:"渋谷",
completion:"2027年"
},

{
name:"中野駅新北口再開発",
station:"中野",
completion:"2028年"
},

{
name:"品川駅西口再開発",
station:"品川",
completion:"2030年"
},

{
name:"池袋駅東口再開発",
station:"池袋",
completion:"2029年"
},

{
name:"立川駅北口再開発",
station:"立川",
completion:"2028年"
}

];

function render(keyword=""){

const area =
document.getElementById("results");

const filtered =
projects.filter(p =>
p.name.includes(keyword)
||
p.station.includes(keyword)
);

area.innerHTML="";

filtered.forEach(p=>{

area.innerHTML += `
<div class="card">
<h3>${p.name}</h3>
<p>最寄駅：${p.station}</p>
<p>所在地：${p.area || ""}</p>
<p>事業者：${p.developer || ""}</p>
<p>状況：${p.status || ""}</p>
<p class="year">完成予定：${p.completion}</p>
</div>
`;

});

}

document
.getElementById("search")
.addEventListener("input",(e)=>{
render(e.target.value);
});

fetch("data.json")
.then(response => response.json())
.then(data => {

  projects = data;

  render();

});

</script>

</body>
</html>
